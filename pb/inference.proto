syntax = "proto3";

package inference;

option go_package = "/inference";

service InferenceService {
  rpc Predict(PredictionRequest) returns (PredictionResponse);
}

message PredictionRequest {
  string request_id = 1;
  string image = 2;
}

message PredictionResponse {
  string result = 1;
  float live = 2;
  float spoof = 3;
}
